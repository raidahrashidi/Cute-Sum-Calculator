<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Raeda Cute Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      touch-action: manipulation;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #fff1f7, #f7f3ff);
      color: #333;
      padding: 14px;
      padding-bottom: 285px;
    }

    .app {
      max-width: 480px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      color: #d9468c;
    }

    .header p {
      font-size: 13px;
      color: #9b6b86;
      margin-top: 6px;
    }

    .grand-card {
      position: sticky;
      top: 8px;
      z-index: 10;
      background: white;
      border: 2px solid #ffd6e8;
      border-radius: 22px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(217, 70, 140, 0.18);
    }

    .grand-label {
      font-size: 13px;
      color: #999;
    }

    .grand-total {
      font-size: 30px;
      font-weight: bold;
      color: #d9468c;
      margin-top: 4px;
    }

    .page-card {
      background: white;
      border-radius: 22px;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #ffe1ef;
      box-shadow: 0 6px 16px rgba(0,0,0,0.07);
    }

    .page-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 17px;
      color: #9b5de5;
    }

    .page-total {
      background: #fce7f3;
      color: #be185d;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 135px;
      border: 1.5px solid #f9c5dc;
      border-radius: 16px;
      padding: 12px;
      font-size: 17px;
      outline: none;
      resize: vertical;
      background: #fffafd;
      color: #444;
      line-height: 1.45;
    }

    textarea:focus,
    textarea.active-input {
      border-color: #d9468c;
      box-shadow: 0 0 0 3px rgba(217, 70, 140, 0.18);
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
      text-align: center;
    }

    .summary {
      background: white;
      border-radius: 22px;
      padding: 15px;
      margin-top: 18px;
      margin-bottom: 14px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    .summary h2 {
      margin: 0 0 10px;
      color: #d9468c;
      font-size: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #ffd6e8;
      font-size: 14px;
    }

    .clear-all {
      width: 100%;
      border: none;
      background: #d9468c;
      color: white;
      padding: 14px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      color: #b47b93;
      margin-bottom: 20px;
    }

    .popup-keypad {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.16);
      padding: 14px;
      z-index: 999;
      transform: translateY(110%);
      transition: 0.25s ease;
      border-top: 2px solid #ffd6e8;
    }

    .popup-keypad.show {
      transform: translateY(0);
    }

    .keypad-inner {
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      transition: 0.2s ease;
    }

    .popup-keypad.small .keypad-inner {
      max-width: 335px;
    }

    .popup-keypad.left .keypad-inner {
      margin-left: 0;
      margin-right: auto;
    }

    .popup-keypad.center .keypad-inner {
      margin-left: auto;
      margin-right: auto;
    }

    .popup-keypad.right .keypad-inner {
      margin-left: auto;
      margin-right: 0;
    }

    .keypad-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: #be185d;
      font-size: 14px;
      font-weight: bold;
    }

    .done-btn {
      border: none;
      background: #fce7f3;
      color: #be185d;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: bold;
      cursor: pointer;
    }

    .keypad-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }

    .keypad-controls button {
      border: none;
      background: #fff1f7;
      color: #be185d;
      padding: 8px 4px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }

    .keypad-controls button.active-control {
      background: #d9468c;
      color: white;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .key {
      border: none;
      border-radius: 17px;
      padding: 15px 0;
      font-size: 20px;
      font-weight: bold;
      background: #ffe4f1;
      color: #be185d;
      box-shadow: 0 4px 9px rgba(217, 70, 140, 0.14);
      cursor: pointer;
      user-select: none;
    }

    .popup-keypad.small .key {
      padding: 12px 0;
      font-size: 18px;
      border-radius: 15px;
    }

    .key:active,
    .done-btn:active,
    .clear-all:active,
    .keypad-controls button:active {
      transform: scale(0.96);
    }

    .key.special {
      background: #eee7ff;
      color: #7c3aed;
    }

    .key.minus {
      background: #fff3c4;
      color: #a16207;
    }

    .key.enter {
      background: #d9468c;
      color: white;
    }

    .key.clear {
      background: #fee2e2;
      color: #dc2626;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <h1>🧮 Cute Sum Calculator</h1>
      <p>For Nabilah & Najihah ✨</p>
    </div>

    <div class="grand-card">
      <div class="grand-label">Grand Total</div>
      <div class="grand-total" id="grandTotal">RM 0.00</div>
    </div>

    <div id="pages"></div>

    <div class="summary">
      <h2>📌 Page Summary</h2>
      <div id="summaryList"></div>
    </div>

    <button class="clear-all" onclick="clearAll()">Clear All 🧹</button>

    <div class="footer">crafted with 🤍 by raeda</div>
  </div>

  <div class="popup-keypad center" id="popupKeypad">
    <div class="keypad-inner">
      <div class="keypad-top">
        <span id="activeLabel">Page 1</span>
        <button class="done-btn" onclick="hideKeypad()">Done ✨</button>
      </div>

      <div class="keypad-controls">
        <button id="sizeBtn" onclick="toggleKeypadSize()">Normal</button>
        <button id="leftBtn" onclick="setKeypadSide('left')">Left</button>
        <button id="centerBtn" class="active-control" onclick="setKeypadSide('center')">Center</button>
        <button id="rightBtn" onclick="setKeypadSide('right')">Right</button>
      </div>

      <div class="keypad-grid">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key special" onclick="pressKey('back')">⌫</button>

        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key minus" onclick="pressKey('-')">−</button>

        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key special" onclick="pressKey('.')">.</button>

        <button class="key clear" onclick="pressKey('clear')">Clear</button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key enter" onclick="pressKey('enter')">Enter</button>
        <button class="key special" onclick="pressKey('+')">+</button>
      </div>
    </div>
  </div>

  <script>
    const pagesContainer = document.getElementById("pages");
    const summaryList = document.getElementById("summaryList");
    const grandTotal = document.getElementById("grandTotal");
    const popupKeypad = document.getElementById("popupKeypad");
    const activeLabel = document.getElementById("activeLabel");

    let activePage = 0;
    let textareas = [];
    let keypadSmall = false;

    function saveData() {
      const data = textareas.map(t => t.value);
      localStorage.setItem("raedaCalculatorData", JSON.stringify(data));
    }

    function loadData() {
      const saved = localStorage.getItem("raedaCalculatorData");
      if (!saved) return Array(6).fill("");

      try {
        const data = JSON.parse(saved);
        return Array.isArray(data) ? data : Array(6).fill("");
      } catch {
        return Array(6).fill("");
      }
    }

    function saveKeypadSettings() {
      const settings = {
        small: keypadSmall,
        side: getCurrentSide()
      };

      localStorage.setItem("raedaKeypadSettings", JSON.stringify(settings));
    }

    function loadKeypadSettings() {
      const saved = localStorage.getItem("raedaKeypadSettings");
      if (!saved) return;

      try {
        const settings = JSON.parse(saved);

        if (settings.small) {
          keypadSmall = true;
          popupKeypad.classList.add("small");
          document.getElementById("sizeBtn").textContent = "Small";
        }

        if (settings.side) {
          setKeypadSide(settings.side, false);
        }
      } catch {}
    }

    function getCurrentSide() {
      if (popupKeypad.classList.contains("left")) return "left";
      if (popupKeypad.classList.contains("right")) return "right";
      return "center";
    }

    function calculateText(text) {
      text = text.replace(/,/g, "");
      const numbers = text.match(/-?\d+(\.\d+)?/g);

      if (!numbers) return 0;

      return numbers.reduce((sum, num) => sum + Number(num), 0);
    }

    function formatRM(value) {
      return "RM " + value.toLocaleString("en-MY", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function updateAll() {
      let grand = 0;
      summaryList.innerHTML = "";

      for (let i = 0; i < 6; i++) {
        const total = calculateText(textareas[i].value);
        grand += total;

        document.getElementById("pageTotal" + i).textContent = formatRM(total);

        const row = document.createElement("div");
        row.className = "summary-row";
        row.innerHTML = `
          <span>Page ${i + 1}</span>
          <strong>${formatRM(total)}</strong>
        `;

        summaryList.appendChild(row);
      }

      grandTotal.textContent = formatRM(grand);
      saveData();
    }

    function showKeypad(index) {
      activePage = index;
      activeLabel.textContent = "Page " + (index + 1);

      textareas.forEach(t => t.classList.remove("active-input"));
      textareas[index].classList.add("active-input");

      popupKeypad.classList.add("show");

      setTimeout(() => {
        textareas[index].focus();
      }, 50);
    }

    function hideKeypad() {
      popupKeypad.classList.remove("show");
      textareas.forEach(t => t.classList.remove("active-input"));
    }

    function toggleKeypadSize() {
      keypadSmall = !keypadSmall;
      const sizeBtn = document.getElementById("sizeBtn");

      if (keypadSmall) {
        popupKeypad.classList.add("small");
        sizeBtn.textContent = "Small";
      } else {
        popupKeypad.classList.remove("small");
        sizeBtn.textContent = "Normal";
      }

      saveKeypadSettings();
      keepFocus();
    }

    function setKeypadSide(side, shouldSave = true) {
      popupKeypad.classList.remove("left", "center", "right");
      popupKeypad.classList.add(side);

      document.getElementById("leftBtn").classList.remove("active-control");
      document.getElementById("centerBtn").classList.remove("active-control");
      document.getElementById("rightBtn").classList.remove("active-control");

      document.getElementById(side + "Btn").classList.add("active-control");

      if (shouldSave) saveKeypadSettings();
      keepFocus();
    }

    function keepFocus() {
      const textarea = textareas[activePage];

      if (!textarea) return;

      const pos = textarea.selectionStart;

      setTimeout(() => {
        textarea.focus();
        textarea.setSelectionRange(pos, pos);
      }, 20);
    }

    function insertAtCursor(textarea, text) {
      textarea.focus();

      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;

      const before = textarea.value.substring(0, start);
      const after = textarea.value.substring(end);

      textarea.value = before + text + after;

      const newPosition = start + text.length;
      textarea.focus();
      textarea.setSelectionRange(newPosition, newPosition);
    }

    function deleteAtCursor(textarea) {
      textarea.focus();

      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;

      if (start !== end) {
        const before = textarea.value.substring(0, start);
        const after = textarea.value.substring(end);

        textarea.value = before + after;
        textarea.focus();
        textarea.setSelectionRange(start, start);
      } else if (start > 0) {
        const before = textarea.value.substring(0, start - 1);
        const after = textarea.value.substring(start);

        textarea.value = before + after;
        textarea.focus();
        textarea.setSelectionRange(start - 1, start - 1);
      }
    }

    function pressKey(key) {
      const textarea = textareas[activePage];

      if (!textarea) return;

      if (key === "back") {
        deleteAtCursor(textarea);
      }

      else if (key === "clear") {
        textarea.value = "";
        textarea.focus();
      }

      else if (key === "enter") {
        insertAtCursor(textarea, "\n");
      }

      else if (key === "+") {
        insertAtCursor(textarea, "\n");
      }

      else {
        insertAtCursor(textarea, key);
      }

      updateAll();
    }

    function createPages() {
      const savedData = loadData();

      for (let i = 0; i < 6; i++) {
        const card = document.createElement("div");
        card.className = "page-card";

        card.innerHTML = `
          <div class="page-title">
            <h2>Page ${i + 1}</h2>
            <div class="page-total" id="pageTotal${i}">RM 0.00</div>
          </div>

          <textarea
            id="pageInput${i}"
            placeholder="Tap here, keypad will appear ✨"
          ></textarea>

          <div class="hint">Tap box to open cute keypad. You can also type using keyboard 🌸</div>
        `;

        pagesContainer.appendChild(card);

        const textarea = document.getElementById("pageInput" + i);
        textarea.value = savedData[i] || "";

        textarea.addEventListener("focus", () => showKeypad(i));
        textarea.addEventListener("click", () => showKeypad(i));
        textarea.addEventListener("input", updateAll);

        textareas.push(textarea);
      }
    }

    function clearAll() {
      if (!confirm("Clear all data?")) return;

      for (let i = 0; i < 6; i++) {
        textareas[i].value = "";
      }

      localStorage.removeItem("raedaCalculatorData");
      updateAll();
    }

    let lastTouchEnd = 0;
    document.addEventListener(
      "touchend",
      function(event) {
        const now = Date.now();

        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }

        lastTouchEnd = now;
      },
      { passive: false }
    );

    createPages();
    loadKeypadSettings();
    updateAll();
  </script>
</body>
</html>
