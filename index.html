<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Raeda Cute Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #fff1f7, #f7f3ff);
      color: #333;
      padding: 14px;
      padding-bottom: 260px;
    }

    .app {
      max-width: 480px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      color: #d9468c;
    }

    .header p {
      font-size: 13px;
      color: #9b6b86;
      margin-top: 6px;
    }

    .grand-card {
      position: sticky;
      top: 8px;
      z-index: 10;
      background: white;
      border: 2px solid #ffd6e8;
      border-radius: 22px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(217, 70, 140, 0.18);
    }

    .grand-label {
      font-size: 13px;
      color: #999;
    }

    .grand-total {
      font-size: 30px;
      font-weight: bold;
      color: #d9468c;
      margin-top: 4px;
    }

    .page-card {
      background: white;
      border-radius: 22px;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #ffe1ef;
      box-shadow: 0 6px 16px rgba(0,0,0,0.07);
    }

    .page-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 17px;
      color: #9b5de5;
    }

    .page-total {
      background: #fce7f3;
      color: #be185d;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 135px;
      border: 1.5px solid #f9c5dc;
      border-radius: 16px;
      padding: 12px;
      font-size: 17px;
      outline: none;
      resize: vertical;
      background: #fffafd;
      color: #444;
      line-height: 1.45;
      caret-color: #d9468c;
    }

    textarea:focus,
    textarea.active-input {
      border-color: #d9468c;
      box-shadow: 0 0 0 3px rgba(217, 70, 140, 0.18);
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
      text-align: center;
    }

    .summary {
      background: white;
      border-radius: 22px;
      padding: 15px;
      margin-top: 18px;
      margin-bottom: 14px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    .summary h2 {
      margin: 0 0 10px;
      color: #d9468c;
      font-size: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #ffd6e8;
      font-size: 14px;
    }

    .clear-all {
      width: 100%;
      border: none;
      background: #d9468c;
      color: white;
      padding: 14px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      color: #b47b93;
      margin-bottom: 20px;
    }

    .popup-keypad {
      display: none;
      position: fixed;
      bottom: 0;
      z-index: 999;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.16);
      border-top: 2px solid #ffd6e8;
      padding: 12px;
      transform: translateY(110%);
      transition: 0.18s ease;
    }

    .popup-keypad.show {
      transform: translateY(0);
    }

    .popup-keypad.center {
      left: 0;
      right: 0;
      width: 100%;
    }

    .popup-keypad.left {
      left: 0;
      width: auto;
    }

    .popup-keypad.right {
      right: 0;
      width: auto;
    }

    .keypad-inner {
      max-width: 420px;
      margin: auto;
    }

    .popup-keypad.small {
      width: 72vw;
      max-width: 340px;
      min-width: 285px;
    }

    .popup-keypad.small .keypad-inner {
      max-width: 100%;
    }

    .keypad-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: #be185d;
      font-size: 13px;
      font-weight: bold;
    }

    .done-btn {
      border: none;
      background: #fce7f3;
      color: #be185d;
      padding: 7px 13px;
      border-radius: 999px;
      font-weight: bold;
      cursor: pointer;
    }

    .keypad-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .keypad-controls button {
      border: none;
      background: #fff1f7;
      color: #be185d;
      padding: 7px 2px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    .keypad-controls button.active-control {
      background: #d9468c;
      color: white;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .key {
      border: none;
      border-radius: 15px;
      padding: 12px 0;
      font-size: 18px;
      font-weight: bold;
      background: #ffe4f1;
      color: #be185d;
      min-height: 46px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    .popup-keypad.small .key {
      padding: 10px 0;
      min-height: 42px;
      font-size: 16px;
    }

    .key:active,
    .done-btn:active,
    .keypad-controls button:active,
    .clear-all:active {
      transform: scale(0.99);
    }

    .key.special {
      background: #eee7ff;
      color: #7c3aed;
    }

    .key.minus {
      background: #fff3c4;
      color: #a16207;
    }

    .key.enter {
      background: #d9468c;
      color: white;
    }

    .key.clear {
      background: #fee2e2;
      color: #dc2626;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <h1>🧮 Cute Sum Calculator</h1>
      <p>Specially For Nabilah & Najihah ✨</p>
    </div>

    <div class="grand-card">
      <div class="grand-label">Grand Total</div>
      <div class="grand-total" id="grandTotal">RM 0.00</div>
    </div>

    <div id="pages"></div>

    <div class="summary">
      <h2>📌 Page Summary</h2>
      <div id="summaryList"></div>
    </div>

    <button class="clear-all" onclick="clearAll()">Clear All 🧹</button>

    <div class="footer">made with 🤍 by raeda</div>
  </div>

  <div class="popup-keypad center" id="popupKeypad">
    <div class="keypad-inner">
      <div class="keypad-top">
        <span id="activeLabel">Now typing: Page 1</span>
        <button class="done-btn" id="doneBtn">Done ✨</button>
      </div>

      <div class="keypad-controls">
        <button id="sizeBtn">Normal</button>
        <button id="leftBtn">Left</button>
        <button id="centerBtn" class="active-control">Center</button>
        <button id="rightBtn">Right</button>
      </div>

      <div class="keypad-grid">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key special" data-key="back">⌫</button>

        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key minus" data-key="-">−</button>

        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key special" data-key=".">.</button>

        <button class="key clear" data-key="clear">Clear</button>
        <button class="key" data-key="0">0</button>
        <button class="key enter" data-key="enter">Enter</button>
        <button class="key special" data-key="+">+</button>
      </div>
    </div>
  </div>

  <script>
    const pagesContainer = document.getElementById("pages");
    const summaryList = document.getElementById("summaryList");
    const grandTotal = document.getElementById("grandTotal");
    const popupKeypad = document.getElementById("popupKeypad");
    const activeLabel = document.getElementById("activeLabel");

    let activePage = 0;
    let textareas = [];
    let keypadSmall = false;

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    function saveData() {
      const data = textareas.map(t => t.value);
      localStorage.setItem("raedaCalculatorData", JSON.stringify(data));
    }

    function loadData() {
      const saved = localStorage.getItem("raedaCalculatorData");
      if (!saved) return Array(6).fill("");

      try {
        const data = JSON.parse(saved);
        return Array.isArray(data) ? data : Array(6).fill("");
      } catch {
        return Array(6).fill("");
      }
    }

    function calculateText(text) {
      text = text.replace(/,/g, "");
      const numbers = text.match(/-?\d+(\.\d+)?/g);
      if (!numbers) return 0;
      return numbers.reduce((sum, num) => sum + Number(num), 0);
    }

    function formatRM(value) {
      return "RM " + value.toLocaleString("en-MY", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function updateAll() {
      let grand = 0;
      summaryList.innerHTML = "";

      for (let i = 0; i < 6; i++) {
        const total = calculateText(textareas[i].value);
        grand += total;

        document.getElementById("pageTotal" + i).textContent = formatRM(total);

        const row = document.createElement("div");
        row.className = "summary-row";
        row.innerHTML = `
          <span>Page ${i + 1}</span>
          <strong>${formatRM(total)}</strong>
        `;
        summaryList.appendChild(row);
      }

      grandTotal.textContent = formatRM(grand);
      saveData();
    }

    function showKeypad(index) {
      activePage = index;
      activeLabel.textContent = "Now typing: Page " + (index + 1);

      textareas.forEach(t => t.classList.remove("active-input"));
      textareas[index].classList.add("active-input");

      textareas[index].focus();

      if (isMobile) {
        popupKeypad.style.display = "block";

        setTimeout(() => {
          popupKeypad.classList.add("show");
        }, 10);
      }
    }

    function hideKeypad() {
      popupKeypad.classList.remove("show");
      textareas.forEach(t => t.classList.remove("active-input"));

      setTimeout(() => {
        popupKeypad.style.display = "none";
      }, 180);
    }

    function toggleKeypadSize() {
      keypadSmall = !keypadSmall;

      if (keypadSmall) {
        popupKeypad.classList.add("small");
        document.getElementById("sizeBtn").textContent = "Small";
      } else {
        popupKeypad.classList.remove("small");
        document.getElementById("sizeBtn").textContent = "Normal";
      }

      saveKeypadSettings();
    }

    function setKeypadSide(side) {
      popupKeypad.classList.remove("left", "center", "right");
      popupKeypad.classList.add(side);

      document.getElementById("leftBtn").classList.remove("active-control");
      document.getElementById("centerBtn").classList.remove("active-control");
      document.getElementById("rightBtn").classList.remove("active-control");

      document.getElementById(side + "Btn").classList.add("active-control");

      saveKeypadSettings();
    }

    function saveKeypadSettings() {
      const settings = {
        small: keypadSmall,
        side: popupKeypad.classList.contains("left")
          ? "left"
          : popupKeypad.classList.contains("right")
          ? "right"
          : "center"
      };

      localStorage.setItem("raedaKeypadSettings", JSON.stringify(settings));
    }

    function loadKeypadSettings() {
      const saved = localStorage.getItem("raedaKeypadSettings");
      if (!saved) return;

      try {
        const settings = JSON.parse(saved);

        if (settings.small) {
          keypadSmall = true;
          popupKeypad.classList.add("small");
          document.getElementById("sizeBtn").textContent = "Small";
        }

        if (settings.side) {
          setKeypadSide(settings.side);
        }
      } catch {}
    }

    function pressKey(key) {
      const textarea = textareas[activePage];

      if (!textarea) return;

      textarea.focus();

      let start = textarea.selectionStart;
      let end = textarea.selectionEnd;
      let value = textarea.value;

      if (key === "back") {
        if (start === end && start > 0) {
          textarea.value = value.substring(0, start - 1) + value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start - 1;
        } else {
          textarea.value = value.substring(0, start) + value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start;
        }
      }

      else if (key === "clear") {
        textarea.value = "";
        textarea.selectionStart = textarea.selectionEnd = 0;
      }

      else {
        let insertText = key;

        if (key === "enter" || key === "+") {
          insertText = "\n";
        }

        textarea.value =
          value.substring(0, start) +
          insertText +
          value.substring(end);

        textarea.selectionStart =
          textarea.selectionEnd =
          start + insertText.length;
      }

      textarea.scrollTop = textarea.scrollHeight;
      updateAll();
    }

    function createPages() {
      const savedData = loadData();

      for (let i = 0; i < 6; i++) {
        const card = document.createElement("div");
        card.className = "page-card";

        card.innerHTML = `
          <div class="page-title">
            <h2>Page ${i + 1}</h2>
            <div class="page-total" id="pageTotal${i}">RM 0.00</div>
          </div>

          <textarea
            id="pageInput${i}"
            inputmode="${isMobile ? "none" : "decimal"}"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Tap here to enter numbers ✨"
          ></textarea>

           <div class="hint">
             ${isMobile ? "chaiyokkk 🌸" : "Type using your keyboard 💻"}
           </div>
        `;

        pagesContainer.appendChild(card);

        const textarea = document.getElementById("pageInput" + i);
        textarea.value = savedData[i] || "";

        textarea.addEventListener("click", () => showKeypad(i));
        textarea.addEventListener("focus", () => {
          textareas.forEach(t => t.classList.remove("active-input"));
          textarea.classList.add("active-input");
        });
        textarea.addEventListener("input", updateAll);

        textareas.push(textarea);
      }
    }

    function clearAll() {
      if (!confirm("Clear all data?")) return;

      for (let i = 0; i < 6; i++) {
        textareas[i].value = "";
      }

      localStorage.removeItem("raedaCalculatorData");
      updateAll();
    }

    document.getElementById("doneBtn").addEventListener("click", hideKeypad);
    document.getElementById("sizeBtn").addEventListener("click", toggleKeypadSize);
    document.getElementById("leftBtn").addEventListener("click", () => setKeypadSide("left"));
    document.getElementById("centerBtn").addEventListener("click", () => setKeypadSide("center"));
    document.getElementById("rightBtn").addEventListener("click", () => setKeypadSide("right"));

    document.querySelectorAll(".key").forEach(button => {
      button.addEventListener("pointerdown", function(event) {
        event.preventDefault();
        pressKey(button.dataset.key);
      });
    });

    createPages();
    loadKeypadSettings();
    updateAll();
  </script>
</body>
</html>
